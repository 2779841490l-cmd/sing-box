name: 大哥专线-暴力总装-终极版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码 (含子模块)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: 2. 环境初始化 (Go+Java+NDK)
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25.5'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28

      - name: 3. 核心工具安装 (SagerNet 专用)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: 4. 灵魂注入 (default_config.json)
        run: |
          # 在安卓主目录下创建 assets
          mkdir -p clients/android/app/src/main/assets/
          cat <<EOF > clients/android/app/src/main/assets/default_config.json
          {
            "outbounds": [
              { "type": "urltest", "tag": "🚀智能加速", "outbounds": ["Hy2-极速", "VLESS-保底"], "url": "https://www.google.com/generate_204", "interval": "5m" },
              { "type": "hysteria2", "tag": "Hy2-极速", "server": "107.174.140.235", "server_port": 56789, "password": "123456", "obfs": { "type": "salamander", "password": "dage666" }, "tls": { "enabled": true, "server_name": "www.icloud.com", "insecure": true } },
              { "type": "vless", "tag": "VLESS-保底", "server": "107.174.140.235", "server_port": 443, "uuid": "3c343d91-b287-4646-b049-086752e67892", "tls": { "enabled": true, "server_name": "www.apple.com", "utls": { "enabled": true, "fingerprint": "chrome" }, "reality": { "enabled": true, "public_key": "JHpo-H-roJ61qZzQaKofejfJU33MY-uu8YX-cncn8z0", "short_id": "9b930b77" } } },
              { "type": "direct", "tag": "direct" }
            ],
            "route": { "auto_detect_interface": true, "rules": [ { "geosite": ["cn"], "geoip": ["cn"], "outbound": "direct" }, { "geosite": ["google", "gemini", "openai"], "outbound": "🚀智能加速" } ] }
          }
          EOF

      - name: 5. 磨制发动机 (多地存放)
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          go run ./cmd/internal/build_libbox -target android
          # 把生成的零件塞进所有可能的 libs 文件夹，防止安卓项目找不到
          mkdir -p clients/android/app/libs/
          mkdir -p clients/android/libs/
          cp libbox.aar clients/android/app/libs/
          cp libbox.aar clients/android/libs/
          echo "✅ 发动机已就位"

      - name: 6. 暴力总装 (跳过检查，直奔 APK)
        run: |
          cd clients/android
          chmod +x gradlew
          # 使用 -x lint 和 -x test 跳过所有那些烦人的检查
          ./gradlew :app:assembleOtherDebug -x lint -x test --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 7. 雷达搜索
        if: always() # 即使失败也要运行，看看文件到底去哪了
        run: |
          mkdir -p ./output_apks
          find . -name "*.apk" -type f -exec cp {} ./output_apks/ \;
          ls -R ./output_apks/

      - name: 8. 提货
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-成品包
          path: ./output_apks/*.apk
