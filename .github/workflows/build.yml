name: 大哥专线-无感化成品-Java修复版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出官方全量代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: 2. 准备官方 Java 17 环境 (自动设置 JAVA_HOME)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # 使用最稳的 Temurin 发行版

      - name: 3. 准备 Go 1.25 和 NDK r28
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25.5'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28

      - name: 4. 关键：注入“130元灵魂配置”
        # 这一步我们直接覆盖默认配置文件
        run: |
          mkdir -p clients/android/app/src/main/assets/
          cat <<EOF > clients/android/app/src/main/assets/default_config.json
          {
            "outbounds": [
              {
                "type": "urltest",
                "tag": "🚀智能加速",
                "outbounds": ["Hy2-极速", "VLESS-保底"],
                "url": "https://www.google.com/generate_204",
                "interval": "5m"
              },
              {
                "type": "hysteria2",
                "tag": "Hy2-极速",
                "server": "107.174.140.235",
                "server_port": 56789,
                "password": "123456",
                "obfs": { "type": "salamander", "password": "dage666" },
                "tls": { "enabled": true, "server_name": "www.icloud.com", "insecure": true }
              },
              {
                "type": "vless",
                "tag": "VLESS-保底",
                "server": "107.174.140.235",
                "server_port": 443,
                "uuid": "3c343d91-b287-4646-b049-086752e67892",
                "tls": { 
                  "enabled": true, 
                  "server_name": "www.apple.com", 
                  "utls": { "enabled": true, "fingerprint": "chrome" },
                  "reality": { "enabled": true, "public_key": "JHpo-H-roJ61qZzQaKofejfJU33MY-uu8YX-cncn8z0", "short_id": "9b930b77" }
                }
              },
              { "type": "direct", "tag": "direct" }
            ],
            "route": {
              "auto_detect_interface": true,
              "rules": [
                { "geosite": ["cn"], "geoip": ["cn"], "outbound": "direct" },
                { "geosite": ["google", "gemini", "openai"], "outbound": "🚀智能加速" }
              ]
            }
          }
          EOF
          echo "✅ 配置已强行注入 assets 目录"

      - name: 5. 编译内核零件 (lib_android)
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 6. 总装成品 APK (不再手动设置 JAVA_HOME)
        run: |
          mkdir -p clients/android/app/libs
          cp *.aar clients/android/app/libs/
          cd clients/android
          chmod +x gradlew
          # 直接运行，setup-java 会帮我们处理好环境
          ./gradlew :app:assembleOtherDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 7. 提货
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-无感化安装包
          path: clients/android/app/build/outputs/apk/**/*.apk
