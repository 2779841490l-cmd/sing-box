name: 大哥专线-逻辑周密-稳定版总装

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 深度检出 (锁定稳定版 v1.12.16)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须为 0，否则看不到 Tag
          submodules: 'recursive'

      - name: 2. 强制切换到稳定 Tag
        run: |
          git checkout v1.12.16
          git submodule update --init --recursive
          echo "✅ 已锁定到 v1.12.16 稳定版，代码接口已对齐"

      - name: 3. 环境锁定 (Go, Java, NDK)
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25.5'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28

      - name: 4. 安装 SagerNet 专用 Gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          $(go env GOPATH)/bin/gomobile init

      - name: 5. 灵魂注入 (default_config.json)
        run: |
          mkdir -p clients/android/app/src/main/assets/
          cat <<EOF > clients/android/app/src/main/assets/default_config.json
          {
            "outbounds": [
              { "type": "urltest", "tag": "🚀智能加速", "outbounds": ["Hy2-极速", "VLESS-保底"], "url": "https://www.google.com/generate_204", "interval": "5m" },
              { "type": "hysteria2", "tag": "Hy2-极速", "server": "107.174.140.235", "server_port": 56789, "password": "123456", "obfs": { "type": "salamander", "password": "dage666" }, "tls": { "enabled": true, "server_name": "www.icloud.com", "insecure": true } },
              { "type": "vless", "tag": "VLESS-保底", "server": "107.174.140.235", "server_port": 443, "uuid": "3c343d91-b287-4646-b049-086752e67892", "tls": { "enabled": true, "server_name": "www.apple.com", "utls": { "enabled": true, "fingerprint": "chrome" }, "reality": { "enabled": true, "public_key": "JHpo-H-roJ61qZzQaKofejfJU33MY-uu8YX-cncn8z0", "short_id": "9b930b77" } } },
              { "type": "direct", "tag": "direct" }
            ],
            "route": { "auto_detect_interface": true, "rules": [ { "geosite": ["cn"], "geoip": ["cn"], "outbound": "direct" }, { "geosite": ["google", "gemini", "openai"], "outbound": "🚀智能加速" } ] }
          }
          EOF
          echo "✅ 资产配置已物理注入"

      - name: 6. 零件生产 (libbox.aar)
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          # 运行官方构建脚本
          go run ./cmd/internal/build_libbox -target android
          mkdir -p clients/android/app/libs/
          cp libbox.aar clients/android/app/libs/

      - name: 7. 暴力对齐 API (彻底解决 SDK 冲突)
        run: |
          # 地毯式搜索所有可能定义 minSdk 的位置并强改 23
          find . -type f \( -name "*.gradle" -o -name "*.kts" \) -print0 | xargs -0 perl -pi -e 's/(minSdk.*?)\d+/$1 23/g'
          find . -type f \( -name "*.gradle" -o -name "*.kts" \) -print0 | xargs -0 perl -pi -e 's/(minSdkVersion.*?)\d+/$1 23/g'
          echo "✅ API 兼容性已强制锁定在 Android 6.0+"

      - name: 8. 总装 APK
        run: |
          cd clients/android
          chmod +x gradlew
          # 增加 --no-configuration-cache 彻底避免缓存导致配置失败
          ./gradlew :app:assembleOtherDebug -x lint -x test --no-daemon --no-configuration-cache
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 9. 自动搜寻与提货
        if: always()
        run: |
          mkdir -p ./output_apks
          find . -name "*.apk" -type f -exec cp {} ./output_apks/ \;
          ls -R ./output_apks/

      - name: 10. 成果上传
        uses: actions/upload-artifact@v4
        with:
          name: 大哥专线-稳定版成品-API23
          path: ./output_apks/*.apk
